<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OneNote - Pantalla Principal (TV)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0f0f13; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
    
    .layout { display: flex; width: 100%; max-width: 1100px; gap: 24px; align-items: flex-start; }
    .main-card { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 20px; background: #16161e; padding: 28px; border-radius: 16px; border: 1px solid #282838; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .scoreboard-card { width: 300px; background: #16161e; padding: 20px; border-radius: 16px; border: 1px solid #282838; display: flex; flex-direction: column; gap: 15px; }
    .scoreboard-title { font-size: 1.2rem; font-weight: 800; color: #ffca28; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #282838; padding-bottom: 10px; }
    .leaderboard { display: flex; flex-direction: column; gap: 10px; list-style: none; }
    .player-rank { display: flex; justify-content: space-between; align-items: center; background: #1f1f2e; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #1db954; font-weight: bold; }
    .player-rank.top { border-left-color: #ffca28; background: #2a281e; }
    .player-score { background: #282838; padding: 4px 10px; border-radius: 12px; color: #1db954; font-size: 0.9rem; }

    h1 { font-size: 2.8rem; font-weight: 900; background: linear-gradient(135deg, #ff0055, #ff5500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .setup-card { width: 100%; text-align: center; display: flex; flex-direction: column; gap: 15px; }
    textarea, input[type="text"] { width: 100%; height: 48px; background: #222230; border: 1px solid #333348; border-radius: 8px; color: #fff; padding: 0 12px; font-size: 1rem; outline: none; }
    textarea { height: 100px; padding: 12px; resize: vertical; }

    .btn-action { height: 48px; background: #ff0055; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
    .btn-action:hover { background: #e0004c; transform: translateY(-2px); }

    .game-area { width: 100%; display: none; flex-direction: column; gap: 18px; }
    .guesses-container { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .guess-box { width: 100%; height: 46px; border: 1px solid #2d2d3f; border-radius: 8px; background: #12121a; display: flex; align-items: center; padding: 0 16px; font-size: 0.95rem; color: #888; font-weight: 500; }
    .guess-box.correct { border-color: #1db954; background: #0f2b1a; color: #1db954; font-weight: bold; }
    .guess-box.wrong { border-color: #ff0055; background: #33101c; color: #ff0055; }
    .guess-box.skipped { border-color: #555; background: #222; color: #aaa; }

    .timeline-indicator { font-size: 1.2rem; color: #ffca28; font-weight: bold; text-align: center; }
    .timeline-bar { display: flex; width: 100%; height: 14px; background: #222230; border-radius: 6px; overflow: hidden; gap: 3px; }
    .segment { background: #333348; height: 100%; transition: background 0.3s; }
    .segment.unlocked { background: #666688; }
    .segment.active { background: #ff0055; box-shadow: 0 0 10px #ff0055; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 10px 0; }
    .play-btn { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #ff0055, #ff5500); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(255,0,85,0.4); }
    .play-btn svg { width: 32px; height: 32px; fill: #fff; margin-left: 4px; }

    .vol-control { display: flex; align-items: center; gap: 10px; color: #aaa; font-size: 0.85rem; }
    .vol-control input { width: 100px; accent-color: #ff0055; }

    .next-btn { width: 100%; height: 48px; background: #1db954; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; display: none; }
    #ytPlayerContainer { position: absolute; top: -9999px; left: -9999px; opacity: 0; }
  </style>
</head>
<body>

  <div class="layout">
    <div class="scoreboard-card">
      <div class="scoreboard-title">🏆 Tabla de Posiciones</div>
      <ul class="leaderboard" id="leaderboard">
        <li style="color: #666; font-size: 0.85rem; text-align: center;">Esperando jugadores...</li>
      </ul>
    </div>

    <div class="main-card">
      <h1>OneNote</h1>

      <div class="setup-card" id="setupCard">
        <h2>Código de Sala</h2>
        <input type="text" id="roomInput" value="1234" style="text-align: center; font-size: 1.2rem; font-weight: bold;" />

        <h2>Ingresar Canciones</h2>
        <textarea id="linksInput" placeholder="Pega enlaces de YouTube (uno por línea)..."></textarea>

        <button class="btn-action" id="startBtn">📺 Habilitar Audio e Iniciar Juego</button>
      </div>

      <div class="game-area" id="gameArea">
        <div class="guesses-container" id="guessesContainer">
          <div class="guess-box"></div>
          <div class="guess-box"></div>
          <div class="guess-box"></div>
          <div class="guess-box"></div>
          <div class="guess-box"></div>
          <div class="guess-box"></div>
        </div>

        <div class="timeline-indicator" id="timeLabel">0.5 segundos</div>
        <div class="timeline-bar" id="timelineBar"></div>

        <div class="controls">
          <button class="play-btn" id="playBtn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="vol-control">
            🔊 <input type="range" id="volSlider" min="0" max="100" value="100" />
          </div>
        </div>

        <button class="next-btn" id="nextBtn">⏭️ Siguiente Canción</button>
      </div>
    </div>
  </div>

  <div id="ytPlayerContainer"><div id="player"></div></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD3vC1zAURPHt2rCLmPF06xElC4KnpWpDU",
      authDomain: "en-una.firebaseapp.com",
      databaseURL: "https://en-una-default-rtdb.firebaseio.com",
      projectId: "en-una",
      storageBucket: "en-una.firebasestorage.app",
      messagingSenderId: "862732139888",
      appId: "1:862732139888:web:7f246b1bdd5f7f97b863b5",
      measurementId: "G-41X7749JTT"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let roomRef = null;

    const STAGES = [0.5, 1.0, 2.0, 4.0, 7.0, 10.0];
    const POINTS = [5, 4, 3, 2, 1, 1];
    let player = null, playlist = [];
    let currentSongIndex = 0, currentAttempt = 0, isGameOver = false, stopTimer = null;
    let scores = {};

    const setupCard = document.getElementById('setupCard');
    const gameArea = document.getElementById('gameArea');
    const linksInput = document.getElementById('linksInput');
    const roomInput = document.getElementById('roomInput');
    const startBtn = document.getElementById('startBtn');
    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const guessesContainer = document.getElementById('guessesContainer');
    const timelineBar = document.getElementById('timelineBar');
    const timeLabel = document.getElementById('timeLabel');
    const volSlider = document.getElementById('volSlider');
    const leaderboard = document.getElementById('leaderboard');

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', { height: '200', width: '200', playerVars: { autoplay: 0, controls: 0 } });
    }

    function extractVideoId(url) {
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function initRoomListener() {
      const roomCode = roomInput.value.trim() || '1234';
      roomRef = db.ref(`rooms/${roomCode}`);

      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.scores) {
          scores = data.scores;
          renderLeaderboard();
        }

        if (data.cmd === 'LOAD_PLAYLIST' && data.playlist_urls) {
          linksInput.value = data.playlist_urls;
          roomRef.update({ cmd: null, playlist_urls: null });
          startBtn.click();
          return;
        }

        if (data.cmd === 'PLAY') { roomRef.update({ cmd: null }); triggerPlay(); return; }
        if (data.cmd === 'SKIP') { roomRef.update({ cmd: null }); makeSkip(); return; }
        if (data.cmd === 'NEXT_SONG') { roomRef.update({ cmd: null }); nextBtn.click(); return; }
        
        if (data.cmd === 'VOL_UP' && player && player.setVolume) {
          const curr = player.getVolume();
          const newV = Math.min(100, curr + 10);
          player.setVolume(newV); volSlider.value = newV;
          roomRef.update({ cmd: null });
        }
        if (data.cmd === 'VOL_DOWN' && player && player.setVolume) {
          const curr = player.getVolume();
          const newV = Math.max(0, curr - 10);
          player.setVolume(newV); volSlider.value = newV;
          roomRef.update({ cmd: null });
        }

        if (data.state === 'BUZZED' && data.first_buzzer && !data.submitted_guess) {
          if (player && player.pauseVideo) player.pauseVideo();
          if (stopTimer) clearTimeout(stopTimer);
          timeLabel.textContent = `✍️ Respondiendo: ${data.first_buzzer.player_name}...`;
        }

        if (data.submitted_guess && data.state === 'BUZZED') {
          processPlayerAnswer(data.submitted_guess.player_name, data.submitted_guess.text);
        }
      });
    }

    initRoomListener();

    volSlider.addEventListener('input', (e) => {
      if (player && player.setVolume) player.setVolume(e.target.value);
    });

    startBtn.addEventListener('click', () => {
      const roomCode = roomInput.value.trim();
      if (!roomCode) return alert('Ingresa un código de sala.');

      const lines = linksInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const parsedIds = lines.map(extractVideoId).filter(id => id !== null);

      if (parsedIds.length === 0) return alert('Ingresa enlaces válidos.');

      playlist = parsedIds.map((id, i) => ({ id: id, title: `Canción ${i + 1}` }));

      for (let i = playlist.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
      }

      if (roomRef) roomRef.update({ state: 'IDLE', first_buzzer: null, submitted_guess: null, cmd: null });

      setupCard.style.display = 'none';
      gameArea.style.display = 'flex';
      renderTimeline();
      loadSong(0);
    });

    function renderLeaderboard() {
      leaderboard.innerHTML = '';
      const sorted = Object.entries(scores).sort((a,b) => Number(b[1]) - Number(a[1]));
      if (sorted.length === 0) {
        leaderboard.innerHTML = '<li style="color: #666; font-size: 0.85rem; text-align: center;">Sin puntos aún</li>';
        return;
      }
      sorted.forEach(([name, pts], index) => {
        const li = document.createElement('li');
        li.className = `player-rank ${index === 0 ? 'top' : ''}`;
        li.innerHTML = `<span>${index === 0 ? '👑 ' : ''}${name}</span><span class="player-score">${pts} pts</span>`;
        leaderboard.appendChild(li);
      });
    }

    function renderTimeline() {
      timelineBar.innerHTML = '';
      const total = STAGES[STAGES.length - 1];
      STAGES.forEach((duration, idx) => {
        const seg = document.createElement('div');
        seg.className = 'segment';
        const prev = idx === 0 ? 0 : STAGES[idx - 1];
        seg.style.width = `${((duration - prev) / total) * 100}%`;
        timelineBar.appendChild(seg);
      });
      updateTimelineUI();
    }

    function updateTimelineUI() {
      const segments = timelineBar.querySelectorAll('.segment');
      segments.forEach((seg, idx) => {
        seg.classList.remove('unlocked', 'active');
        if (idx < currentAttempt) seg.classList.add('unlocked');
        if (idx === currentAttempt) seg.classList.add('active');
      });
      timeLabel.textContent = `${STAGES[currentAttempt]} segundos (${POINTS[currentAttempt]} pts)`;
    }

    function loadSong(index) {
      currentSongIndex = index;
      currentAttempt = 0;
      isGameOver = false;

      if (roomRef) roomRef.update({ state: 'IDLE', first_buzzer: null, submitted_guess: null, cmd: null });
      if (player && player.cueVideoById) player.cueVideoById(playlist[currentSongIndex].id, 0);

      setTimeout(() => {
        if (player && player.getVideoData) {
          const data = player.getVideoData();
          if (data && data.title) playlist[currentSongIndex].title = cleanTitle(data.title);
        }
      }, 1000);

      const boxes = guessesContainer.querySelectorAll('.guess-box');
      boxes.forEach(box => { box.textContent = ''; box.className = 'guess-box'; });

      nextBtn.style.display = 'none';
      updateTimelineUI();
    }

    function cleanTitle(title) {
      return title.replace(/[\(\[\{].*?[\)\]\}]/g, '').replace(/official video|lyric video|hd|4k|mv/gi, '').trim();
    }

    function triggerPlay() {
      if (!player || !player.playVideo) return;
      if (stopTimer) clearTimeout(stopTimer);

      if (roomRef) roomRef.update({ state: 'PLAYING', first_buzzer: null, submitted_guess: null });

      player.seekTo(0, true);
      player.playVideo();

      if (!isGameOver) {
        const playDuration = STAGES[currentAttempt] * 1000;
        stopTimer = setTimeout(() => { player.pauseVideo(); }, playDuration);
      }
    }

    playBtn.addEventListener('click', triggerPlay);

    function checkMatch(userText, actualTitle) {
      const norm = str => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, "").trim();
      const u = norm(userText), a = norm(actualTitle);
      if (u === a || a.includes(u)) return true;
      const words = u.split(' ').filter(w => w.length > 2);
      let matches = 0;
      words.forEach(w => { if (a.includes(w)) matches++; });
      return matches >= Math.min(2, words.length) && words.length > 0;
    }

    function processPlayerAnswer(playerName, userText) {
      const boxes = guessesContainer.querySelectorAll('.guess-box');
      const currentBox = boxes[currentAttempt];
      const correctTitle = playlist[currentSongIndex].title;

      const isCorrect = checkMatch(userText, correctTitle);

      if (isCorrect) {
        const earned = Number(POINTS[currentAttempt]);
        const currentScore = Number(scores[playerName] || 0);
        scores[playerName] = currentScore + earned;
        
        if (roomRef) roomRef.child('scores').set(scores);

        currentBox.textContent = `${playerName}: ${userText} (+${earned} pts)`;
        currentBox.classList.add('correct');
        endRound(true, playerName);
      } else {
        currentBox.textContent = `${playerName}: ${userText} (INCORRECTO)`;
        currentBox.classList.add('wrong');
        currentAttempt++;

        if (currentAttempt >= STAGES.length) {
          endRound(false);
        } else {
          updateTimelineUI();
          if (roomRef) roomRef.update({ state: 'IDLE', first_buzzer: null, submitted_guess: null });
        }
      }
    }

    function makeSkip() {
      if (isGameOver) return;
      const boxes = guessesContainer.querySelectorAll('.guess-box');
      const currentBox = boxes[currentAttempt];
      currentBox.textContent = 'SKIP';
      currentBox.classList.add('skipped');

      currentAttempt++;
      if (currentAttempt >= STAGES.length) {
        endRound(false);
      } else {
        updateTimelineUI();
        if (roomRef) roomRef.update({ state: 'IDLE', first_buzzer: null, submitted_guess: null });
      }
    }

    function endRound(win, winnerName) {
      isGameOver = true;
      nextBtn.style.display = 'block';
      const songTitle = playlist[currentSongIndex].title;

      if (win) {
        timeLabel.textContent = `🎉 ¡Ganó ${winnerName}! Era "${songTitle}"`;
      } else {
        timeLabel.textContent = `❌ Se acabaron los intentos. Era "${songTitle}"`;
      }

      if (player && player.playVideo) {
        player.seekTo(0, true);
        player.playVideo();
      }

      if (roomRef) roomRef.update({ state: 'IDLE', first_buzzer: null, submitted_guess: null });
    }

    nextBtn.addEventListener('click', () => {
      if (currentSongIndex + 1 < playlist.length) loadSong(currentSongIndex + 1);
      else alert('¡Has completado toda la playlist!');
    });
  </script>
</body>
</html>
